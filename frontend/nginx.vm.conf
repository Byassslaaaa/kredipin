# Konfigurasi Nginx untuk deploy KrediPin di VM tanpa domain (IP saja).
#
# Berbeda dari nginx.conf biasa: file ini SEKALIGUS mem-proxy /api/* ke
# container backend, sehingga frontend & API berbagi origin yang sama
# (http://IP/ dan http://IP/api/*). Tidak butuh reverse proxy eksternal,
# tidak ada masalah CORS, dan tidak perlu HTTPS/domain.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip aset statis.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → backend FastAPI (prefix /api di-strip oleh trailing slash).
    # Contoh: /api/health -> http://backend:8000/health
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache aset ber-hash lama; jangan cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: semua rute klien diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
