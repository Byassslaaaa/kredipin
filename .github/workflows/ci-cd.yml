# CI/CD KrediPin
#
# CI  : setiap push / pull request -> jalankan pytest backend + build frontend.
# CD  : hanya pada push ke `main` dan HANYA jika CI lolos -> deploy ke VM kampus
#       lewat SSH (git pull + docker compose up). Tidak butuh port 80 di-forward,
#       karena deploy memakai SSH (157.66.9.7:2208) yang sudah publik.
#
# Secrets yang diperlukan untuk job "deploy" (Settings > Secrets and variables >
# Actions): VM_HOST, VM_PORT, VM_USER, VM_SSH_KEY. Lihat CICD.md untuk setup.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- CI: uji backend ----------
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KrediPin_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: KrediPin_backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # `python -m pytest` (bukan `pytest`) agar folder kerja KrediPin_backend
      # masuk sys.path, sehingga `from app.main import app` dapat di-resolve.
      # `tests/` tidak punya __init__.py, jadi pytest langsung hanya memasukkan
      # folder tests/ ke sys.path dan `app` tidak ketemu.
      - name: Run tests
        run: python -m pytest -q

  # ---------- CI: build frontend ----------
  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ---------- CD: deploy ke VM (hanya push ke main, setelah CI lolos) ----------
  deploy:
    name: Deploy ke VM
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy lewat SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.VM_PORT }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/kredipin
            git pull --ff-only

            # Disk VM sangat terbatas (~5.7 GB) sementara stack ML besar
            # (scipy/numpy/sklearn/xgboost). Bersihkan image & build cache tak
            # terpakai SEBELUM build agar tidak "no space left on device".
            # CATATAN: tanpa --volumes, sehingga volume kredipin_db
            # (riwayat prediksi) TIDAK ikut terhapus.
            docker system prune -af
            docker builder prune -af

            docker compose -f docker-compose.vm.yml up -d --build

            # Sisakan disk lega untuk deploy berikutnya.
            docker builder prune -af
            docker compose -f docker-compose.vm.yml ps
            df -h /
